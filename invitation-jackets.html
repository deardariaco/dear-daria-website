<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pochettes d'Invitation | Beau Papier</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<header class="hero-controlled">
  <div class="hc-media">
    <img id="hero-image" class="hero-img-magnolia" src="" alt="Beau Papier invitation jacket">
  </div>
  <div class="hc-copy">
    <span class="eyebrow rosewood" data-i18n="signature_eyebrow"></span>
    <h1 data-i18n="pochettes_heading"></h1>
    <p class="lede" data-i18n="pochettes_sub"></p>
  </div>
</header>

<section class="section tight border-top">
  <div class="container">
    <div class="section-head"><div><h2 data-i18n="pochettes_heading"></h2></div></div>
    <div id="products-grid" class="grid cols-3"></div>
    <p class="photos-example-note" data-i18n="photos_examples_note"></p>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/data.js"></script>
<script src="js/inspirations.js"></script>
<script>
(async function () {
  const data = await DearDaria.loadData();
  const FAIRE_PART_TYPES = ['sleeve', 'jacket', 'other'];
  const fairePartOrder = new Map(
    (data.faire_part_catalogue_order || []).map((key, index) => [key, index])
  );
  const allFairePartProducts = [];
  data.collections.forEach(c => {
    c.products.forEach(p => {
      if (FAIRE_PART_TYPES.includes(p.type) && p.catalogue_order_pochette) {
        allFairePartProducts.push({ collection: c, product: p });
      }
    });
  });

  function render() {
    const heroEntry = allFairePartProducts.find(e => e.collection.id === 'hummingbird') || allFairePartProducts[0];
    document.getElementById('hero-image').src = DearDaria.imgUrl(heroEntry.product.images[0]);

    const cards = allFairePartProducts
      .slice()
      .sort((a, b) => {
        const aOrder = fairePartOrder.get(`${a.collection.id}:${a.product.type}`) ?? Infinity;
        const bOrder = fairePartOrder.get(`${b.collection.id}:${b.product.type}`) ?? Infinity;
        return aOrder - bOrder || a.product.catalogue_order_pochette - b.product.catalogue_order_pochette;
      })
      .map(({ collection, product }) => DearDaria.productCardHTML(collection, product, product.images[0]))
      .join('');
    DearDaria.renderGrid('products-grid', cards, 3);
  }
  DearDaria.reRenderDynamic = render;
  render();
})();
</script>
</body>
</html>
