<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sur Mesure — Beau Papier</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<header class="hero-controlled">
  <div class="hc-media">
    <img id="hero-image" class="lazy-img" loading="lazy" src="" alt="Beau Papier bespoke wedding invitation">
  </div>
  <div class="hc-copy">
    <span class="eyebrow brass" data-i18n="sur_mesure_heading"></span>
    <h1 data-i18n="sur_mesure_heading"></h1>
    <p class="lede" data-i18n="sur_mesure_text"></p>
    <div class="btn-row">
      <a href="consultation.html?type=type_bespoke" class="btn primary" data-i18n="talk_about_project"></a>
    </div>
  </div>
</header>

<section class="section border-top">
  <div class="container">
    <div class="section-head"><div><h2 data-i18n="process_heading"></h2></div></div>
    <div class="process5-grid">
      <div class="step"><span class="num">01</span><h4 data-i18n="process1_title"></h4><p data-i18n="process1_text"></p></div>
      <div class="step"><span class="num">02</span><h4 data-i18n="process2_title"></h4><p data-i18n="process2_text"></p></div>
      <div class="step"><span class="num">03</span><h4 data-i18n="process3_title"></h4><p data-i18n="process3_text"></p></div>
      <div class="step"><span class="num">04</span><h4 data-i18n="process4_title"></h4><p data-i18n="process4_text"></p></div>
      <div class="step"><span class="num">05</span><h4 data-i18n="process5_title"></h4><p data-i18n="process5_text"></p></div>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/data.js"></script>
<script>
(async function () {
  const data = await DearDaria.loadData();
  const heroCollection = data.collections.find(c => c.id === 'calla_bloom') || data.collections[0];
  document.getElementById('hero-image').src = DearDaria.imgUrl(heroCollection.hero);
  DearDaria.initLazyImages();
})();
</script>
</body>
</html>
