<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sur Mesure — Dear Daria</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<header class="hero" style="min-height:70vh;">
  <div class="hero-media">
    <img id="hero-image" class="lazy-img" loading="lazy" src="" alt="Dear Daria bespoke wedding invitation">
  </div>
  <div class="hero-copy">
    <span class="eyebrow brass" data-i18n="bespoke_eyebrow"></span>
    <h1 style="font-size:clamp(36px,4.6vw,64px);" data-i18n="bespoke_title"></h1>
    <p class="lede" data-i18n="bespoke_lede"></p>
    <div class="btn-row"><a href="#inquire" class="btn primary" data-i18n="btn_start_inquiry"></a></div>
  </div>
</header>

<section class="section border-top">
  <div class="container">
    <div class="section-head"><div><span class="eyebrow" data-i18n="process_eyebrow"></span><h2 data-i18n="process_title"></h2></div></div>
    <div class="process-list">
      <div class="process-step">
        <div class="num">01</div>
        <h3 data-i18n="step1_title"></h3>
        <p data-i18n="step1_text"></p>
      </div>
      <div class="process-step">
        <div class="num">02</div>
        <h3 data-i18n="step2_title"></h3>
        <p data-i18n="step2_text"></p>
      </div>
      <div class="process-step">
        <div class="num">03</div>
        <h3 data-i18n="step3_title"></h3>
        <p data-i18n="step3_text"></p>
      </div>
      <div class="process-step">
        <div class="num">04</div>
        <h3 data-i18n="step4_title"></h3>
        <p data-i18n="step4_text"></p>
      </div>
    </div>
  </div>
</section>

<section class="section border-top" id="inquire">
  <div class="container" style="max-width:760px;">
    <div class="section-head"><div><span class="eyebrow" data-i18n="inquire_eyebrow"></span><h2 data-i18n="inquire_title"></h2></div></div>
    <form class="form-grid" onsubmit="event.preventDefault(); this.querySelector('.submit-note').style.display='block';">
      <div class="field"><label for="name" data-i18n="field_name"></label><input id="name" type="text" required></div>
      <div class="field"><label for="email" data-i18n="field_email"></label><input id="email" type="email" required></div>
      <div class="field"><label for="date" data-i18n="field_date"></label><input id="date" type="date"></div>
      <div class="field"><label for="venue" data-i18n="field_venue"></label><input id="venue" type="text"></div>
      <div class="field full"><label for="details" data-i18n="field_details"></label><textarea id="details" data-i18n="field_details_placeholder" data-i18n-placeholder></textarea></div>
      <div class="field full">
        <button type="submit" class="btn primary" data-i18n="btn_send_inquiry"></button>
        <p class="submit-note" style="display:none; margin-top:16px; color:var(--sage-deep); font-size:14px;" data-i18n="submit_note_bespoke"></p>
      </div>
    </form>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/data.js"></script>
<script>
(async function () {
  const data = await DearDaria.loadData();
  const heroCollection = data.collections.find(c => c.id === 'calla_bloom') || data.collections[0];
  document.getElementById('hero-image').src = DearDaria.imgUrl(heroCollection.hero);
  DearDaria.initLazyImages();
})();
</script>
</body>
</html>
