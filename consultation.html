<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demander une Consultation — Beau Papier</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<header class="section tight">
  <div class="container">
    <h1 style="font-size:clamp(32px,4.4vw,52px); font-style:italic;" data-i18n="nav_request_consultation"></h1>
  </div>
</header>

<section class="section tight border-top">
  <div class="container" id="form-mount"></div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/data.js"></script>
<script src="js/consultation.js"></script>
<script>
(function () {
  function render() {
    const params = new URLSearchParams(window.location.search);
    document.getElementById('form-mount').innerHTML = Consultation.formHTML({
      designName: params.get('design') || '',
      designSlug: params.get('slug') || '',
    });
    DearDaria.applyTranslations();
    Consultation.wireForm();
    Consultation.applyDesignContext();

    const projectType = params.get('type');
    if (projectType) {
      const sel = document.getElementById('cf-project-type');
      if (sel) sel.value = projectType;
    }
  }
  // Note: no reRenderDynamic assignment here - applyTranslations() alone
  // correctly re-translates the already-injected form on a language switch,
  // without needing to rebuild it (which would loop back into this function).
  document.addEventListener('DOMContentLoaded', () => setTimeout(render, 0));
})();
</script>
</body>
</html>
