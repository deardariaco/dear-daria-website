<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Modèle | Beau Papier</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<div id="content"></div>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/data.js"></script>
<script src="js/gallery.js"></script>
<script>
(async function () {
  const slug = DearDaria.getQueryParam('slug');
  const type = DearDaria.getQueryParam('type');
  const data = await DearDaria.loadData();
  const collection = data.collections.find(c => c.slug === slug);
  const content = document.getElementById('content');

  function render() {
    if (!collection) {
      content.innerHTML = `<div class="section container"><div class="empty-state"><h3>${DearDaria.t('product_not_found')}</h3><p><a href="invitation-jackets.html">${DearDaria.t('return_shop')}</a></p></div></div>`;
      return;
    }
    const product = collection.products.find(p => p.type === type) || collection.products[0];
    const title = DearDaria.productTitle(product);

    document.getElementById('page-title').textContent = `${title} | Beau Papier`;

    const label = DearDaria.productTypeLabel(product.type);
    const isPersonalisable = DearDaria.PERSONALISABLE_TYPES.includes(product.type);
    const badge = isPersonalisable ? `<span class="badge-personalisable">${DearDaria.t('personalisable_badge')}</span>` : '';

    // Suites get the complete gallery (every coordinated piece), not just
    // the bundle's own overview photos. Individual pieces show their own
    // images only, since that page is about that one item.
    const isSuite = product.type === 'bundle';
    const galleryEntries = isSuite
      ? DearDaria.buildSuiteGallery(collection)
      : product.images.map(img => ({ image: img, caption: label, type: product.type }));
    const galleryImageList = galleryEntries.map(e => e.image);
    const galleryCaptionList = galleryEntries.map(e => e.caption);

    const galleryImgs = galleryEntries.map(e =>
      `<img class="lazy-img" loading="lazy" src="${DearDaria.imgUrl(e.image)}" alt="${DearDaria.collectionDisplayName(collection)}, ${e.caption}">`
    ).join('');

    const otherPieces = collection.products
      .filter(p => p.type !== product.type)
      .map(p => `<a class="tag" href="product.html?slug=${collection.slug}&type=${p.type}">${DearDaria.productTypeLabel(p.type)}</a>`)
      .join('');

    const consultUrl = `consultation.html?design=${encodeURIComponent(title)}&slug=${collection.slug}`;

    content.innerHTML = `
      <section class="section tight">
        <div class="container">
          <div class="breadcrumb">
            <a href="invitation-jackets.html">${DearDaria.t('nav_pochettes')}</a> &nbsp;/&nbsp; <a href="collection.html?slug=${collection.slug}">${DearDaria.collectionDisplayName(collection)}</a> &nbsp;/&nbsp; ${label}
          </div>
          <div class="detail-hero">
            <div class="media">
              <div class="media-frame">
                <img id="gallery-main-img" src="${DearDaria.imgUrl(galleryImageList[0])}" alt="${DearDaria.collectionDisplayName(collection)}, ${galleryCaptionList[0]}">
                ${DearDaria.galleryArrowsHTML(DearDaria.getLang())}
              </div>
              <p class="gallery-caption" id="gallery-caption-main">${galleryCaptionList[0]}</p>
            </div>
            <div class="copy">
              <span class="eyebrow">${DearDaria.collectionDisplayName(collection)}, ${label}</span>
              <h1>${title}</h1>
              <div class="type-row" style="margin-bottom:18px;">${badge}</div>
              <p class="desc">${DearDaria.collectionDescription(collection)}</p>
              <div class="btn-row">
                <a href="${consultUrl}" class="btn primary">${DearDaria.t('request_consultation_for')}</a>
              </div>
              ${otherPieces ? `<div style="margin-top:32px;"><span class="eyebrow">${DearDaria.t('also_in_collection')}</span><div class="tag-row">${otherPieces}</div></div>` : ''}
              <p class="photos-example-note">${DearDaria.t('photos_examples_note')}</p>
            </div>
          </div>
        </div>
      </section>

      <section class="section tight border-top">
        <div class="container">
          <div class="section-head"><div><span class="eyebrow">${DearDaria.t('gallery_label')}</span><h2>${DearDaria.t('closer_look')}</h2></div></div>
          <div class="gallery-strip" id="gallery-thumbs">${galleryImgs}</div>
        </div>
      </section>
    `;

    DearDaria.initLazyImages();

    DearDaria.initProductGallery({
      images: galleryImageList,
      captions: galleryCaptionList,
      mainImgEl: document.getElementById('gallery-main-img'),
      prevBtnEl: document.getElementById('gallery-prev'),
      nextBtnEl: document.getElementById('gallery-next'),
      thumbContainer: document.getElementById('gallery-thumbs'),
      altText: DearDaria.collectionDisplayName(collection),
      captionEl: document.getElementById('gallery-caption-main'),
    });
  }

  DearDaria.reRenderDynamic = render;
  render();
})();
</script>
</body>
</html>
