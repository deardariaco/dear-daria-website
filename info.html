<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>À Propos | Beau Papier</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<!-- ABOUT (real text, no substitute photo) -->
<section class="section tight" id="about">
  <div class="container" style="max-width:760px;">
    <span class="eyebrow" data-i18n="about_eyebrow"></span>
    <h1 style="font-size:clamp(32px,4.4vw,48px); margin-top:14px; margin-bottom:20px;" data-i18n="about_title"></h1>
    <p data-i18n="about_text1"></p>
    <p style="margin-top:16px;" data-i18n="about_text2"></p>
    <p style="margin-top:16px;" data-i18n="about_text3"></p>
  </div>
</section>

<!-- FOR PROFESSIONALS -->
<section class="section tight border-top" id="professionals">
  <div class="container">
    <div class="split-row reverse">
      <div class="media"><img id="pro-img" class="lazy-img" loading="lazy" src="" alt="Beau Papier wedding suite detail"></div>
      <div class="copy">
        <span class="eyebrow rosewood" data-i18n="pro_eyebrow"></span>
        <h2 data-i18n="pro_title"></h2>
        <p data-i18n="pro_text1"></p>
        <p style="margin-top:14px;" data-i18n="pro_text2"></p>
        <a href="consultation.html" class="btn ghost" style="margin-top:8px;" data-i18n="pro_cta"></a>
      </div>
    </div>
  </div>
</section>

<!-- OTHER CELEBRATIONS -->
<section class="section tight border-top" id="other-celebrations">
  <div class="container">
    <span class="eyebrow" data-i18n="other_eyebrow"></span>
    <h2 style="font-style:italic; font-size:clamp(26px,3vw,36px); margin-top:14px; margin-bottom:14px;" data-i18n="other_title"></h2>
    <p style="color:var(--ink-soft); max-width:60ch; line-height:1.7;">
      <span data-i18n="other_text"></span>
      <a href="consultation.html" style="text-decoration:underline; color:var(--ink);" data-i18n="other_cta"></a>
    </p>
  </div>
</section>

<!-- LINKS TO FAQ + CONSULTATION -->
<div class="contact-banner">
  <h2 data-i18n="faq_preview_heading"></h2>
  <p data-i18n="signature_selection_note"></p>
  <div class="btn-row" style="justify-content:center;">
    <a href="faq.html" class="btn ghost" data-i18n="see_full_faq"></a>
    <a href="consultation.html" class="btn primary" data-i18n="nav_request_consultation"></a>
  </div>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/data.js"></script>
<script>
(async function () {
  const data = await DearDaria.loadData();
  const c2 = data.collections.find(c => c.id === 'boho_peony') || data.collections[0];
  document.getElementById('pro-img').src = DearDaria.imgUrl(c2.hero);
  DearDaria.initLazyImages();
})();
</script>
</body>
</html>
