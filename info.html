<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infos — Dear Daria</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<header class="section tight">
  <div class="container">
    <span class="eyebrow" data-i18n="info_eyebrow"></span>
    <h1 style="font-size:clamp(36px,5vw,60px); font-style:italic; margin-top:14px;" data-i18n="info_title"></h1>
  </div>
</header>

<!-- ABOUT -->
<section class="section tight border-top" id="about">
  <div class="container">
    <div class="split-row">
      <div class="media"><img id="about-img" class="lazy-img" loading="lazy" src="" alt="Dear Daria studio"></div>
      <div class="copy">
        <span class="eyebrow" data-i18n="about_eyebrow"></span>
        <h2 data-i18n="about_title"></h2>
        <p data-i18n="about_text1"></p>
        <p style="margin-top:16px;" data-i18n="about_text2"></p>
      </div>
    </div>
  </div>
</section>

<!-- HOW IT WORKS -->
<section class="section tight border-top" id="how-it-works">
  <div class="container">
    <div class="section-head"><div><span class="eyebrow" data-i18n="hiw_eyebrow"></span><h2 data-i18n="hiw_title"></h2></div></div>
    <div class="process-list">
      <div class="process-step"><div class="num">01</div><h3 data-i18n="hiw1_title"></h3><p data-i18n="hiw1_text"></p></div>
      <div class="process-step"><div class="num">02</div><h3 data-i18n="hiw2_title"></h3><p data-i18n="hiw2_text"></p></div>
      <div class="process-step"><div class="num">03</div><h3 data-i18n="hiw3_title"></h3><p data-i18n="hiw3_text"></p></div>
      <div class="process-step"><div class="num">04</div><h3 data-i18n="hiw4_title" data-i18n-html></h3><p data-i18n="hiw4_text" data-i18n-html></p></div>
    </div>
  </div>
</section>

<!-- CUSTOMIZATION -->
<section class="section tight border-top" id="customization">
  <div class="container">
    <div class="section-head"><div><span class="eyebrow" data-i18n="custom_eyebrow"></span><h2 data-i18n="custom_title"></h2></div></div>
    <div class="custom-grid">
      <div class="custom-card">
        <span class="eyebrow" data-i18n="custom1_eyebrow"></span>
        <h3 data-i18n="custom1_title"></h3>
        <p data-i18n="custom1_text"></p>
      </div>
      <div class="custom-card">
        <span class="eyebrow" data-i18n="custom2_eyebrow"></span>
        <h3 data-i18n="custom2_title"></h3>
        <p data-i18n="custom2_text"></p>
      </div>
      <div class="custom-card">
        <span class="eyebrow" data-i18n="custom3_eyebrow"></span>
        <h3 data-i18n="custom3_title"></h3>
        <p data-i18n="custom3_text" data-i18n-html></p>
      </div>
    </div>
  </div>
</section>

<!-- FOR PROFESSIONALS -->
<section class="section tight border-top" id="professionals">
  <div class="container">
    <div class="split-row reverse">
      <div class="media"><img id="pro-img" class="lazy-img" loading="lazy" src="" alt="Dear Daria wedding suite detail"></div>
      <div class="copy">
        <span class="eyebrow rosewood" data-i18n="pro_eyebrow"></span>
        <h2 data-i18n="pro_title"></h2>
        <p data-i18n="pro_text"></p>
        <a href="info.html#contact" class="btn ghost" style="margin-top:8px;" data-i18n="pro_cta"></a>
      </div>
    </div>
  </div>
</section>

<!-- OTHER CELEBRATIONS -->
<section class="section tight border-top" id="other-celebrations">
  <div class="container">
    <span class="eyebrow" data-i18n="other_eyebrow"></span>
    <h2 style="font-style:italic; font-size:clamp(26px,3vw,36px); margin-top:14px; margin-bottom:14px;" data-i18n="other_title"></h2>
    <p style="color:var(--ink-soft); max-width:60ch; line-height:1.7;">
      <span data-i18n="other_text"></span>
      <a href="bespoke.html" style="text-decoration:underline; color:var(--ink);" data-i18n="other_cta"></a>
    </p>
  </div>
</section>

<!-- FAQ -->
<section class="section tight border-top" id="faq">
  <div class="container" style="max-width:820px;">
    <div class="section-head"><div><span class="eyebrow" data-i18n="faq_eyebrow"></span><h2 data-i18n="faq_title"></h2></div></div>

    <details class="faq-item">
      <summary data-i18n="faq1_q"></summary>
      <p data-i18n="faq1_a"></p>
    </details>
    <details class="faq-item">
      <summary data-i18n="faq2_q"></summary>
      <p data-i18n="faq2_a"></p>
    </details>
    <details class="faq-item">
      <summary data-i18n="faq3_q"></summary>
      <p data-i18n="faq3_a"></p>
    </details>
    <details class="faq-item">
      <summary data-i18n="faq4_q"></summary>
      <p data-i18n="faq4_a"></p>
    </details>
    <details class="faq-item">
      <summary data-i18n="faq5_q"></summary>
      <p data-i18n="faq5_a"></p>
    </details>
  </div>
</section>

<!-- CONTACT -->
<section class="section tight border-top" id="contact">
  <div class="container" style="max-width:640px;">
    <div class="section-head"><div><span class="eyebrow" data-i18n="contact_eyebrow"></span><h2 data-i18n="contact_title"></h2></div></div>
    <form class="form-grid" onsubmit="event.preventDefault(); this.querySelector('.submit-note').style.display='block';">
      <div class="field"><label for="c-name" data-i18n="field_name"></label><input id="c-name" type="text" required></div>
      <div class="field"><label for="c-email" data-i18n="field_email"></label><input id="c-email" type="email" required></div>
      <div class="field full"><label for="c-message" data-i18n="field_message"></label><textarea id="c-message" required></textarea></div>
      <div class="field full">
        <button type="submit" class="btn primary" data-i18n="btn_send_message"></button>
        <p class="submit-note" style="display:none; margin-top:16px; color:var(--sage-deep); font-size:14px;" data-i18n="submit_note_contact"></p>
      </div>
    </form>
    <p style="margin-top:24px; font-size:14px; color:var(--ink-soft);"><span data-i18n="contact_or"></span> <a href="mailto:hello@deardaria.com" style="text-decoration:underline; color:var(--ink);">hello@deardaria.com</a></p>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/data.js"></script>
<script>
(async function () {
  const data = await DearDaria.loadData();
  const c1 = data.collections.find(c => c.id === 'hydrangea') || data.collections[0];
  const c2 = data.collections.find(c => c.id === 'boho_peony') || data.collections[1] || data.collections[0];
  document.getElementById('about-img').src = DearDaria.imgUrl(c1.hero);
  document.getElementById('pro-img').src = DearDaria.imgUrl(c2.hero);
  DearDaria.initLazyImages();
})();
</script>
</body>
</html>
