<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Modèle | Beau Papier</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<div id="content"></div>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/data.js"></script>
<script src="js/inspirations.js"></script>
<script src="js/gallery.js"></script>
<script>
(async function () {
  const slug = DearDaria.getQueryParam('slug');
  const data = await DearDaria.loadData();
  const collection = data.collections.find(c => c.slug === slug);
  const content = document.getElementById('content');

  function render() {
    if (!collection) {
      content.innerHTML = `<div class="section container"><div class="empty-state"><h3>${DearDaria.t('collection_not_found')}</h3><p><a href="invitation-jackets.html">${DearDaria.t('return_shop')}</a></p></div></div>`;
      return;
    }

    document.getElementById('page-title').textContent = `${DearDaria.collectionDisplayName(collection)} | Beau Papier`;
    const consultUrl = `consultation.html?design=${encodeURIComponent(DearDaria.collectionDisplayName(collection))}&slug=${collection.slug}`;

    const piecesHTML = collection.products.map(p => {
      const label = DearDaria.productTypeLabel(p.type);
      const isPersonalisable = DearDaria.PERSONALISABLE_TYPES.includes(p.type);
      return `
        <a class="piece-row" href="product.html?slug=${collection.slug}&type=${p.type}" style="color:inherit;">
          <span class="piece-name">${label}</span>
          <span>${isPersonalisable ? `<span class="badge-personalisable">${DearDaria.t('personalisable_badge')}</span>` : ''}</span>
        </a>`;
    }).join('');

    const galleryEntries = DearDaria.buildSuiteGallery(collection);
    const galleryImageList = galleryEntries.map(e => e.image);
    const galleryCaptionList = galleryEntries.map(e => e.caption);
    const galleryImgs = galleryEntries.map(e =>
      `<img class="lazy-img" loading="lazy" src="${DearDaria.imgUrl(e.image)}" alt="${DearDaria.collectionDisplayName(collection)}, ${e.caption}">`
    ).join('');

    content.innerHTML = `
      <section class="section tight">
        <div class="container">
          <div class="breadcrumb"><a href="invitation-jackets.html">${DearDaria.t('nav_pochettes')}</a> &nbsp;/&nbsp; ${DearDaria.collectionDisplayName(collection)}</div>
          <div class="detail-hero">
            <div class="media">
              <div class="media-frame">
                <img id="gallery-main-img" src="${DearDaria.imgUrl(galleryImageList[0])}" alt="${DearDaria.collectionDisplayName(collection)}, ${galleryCaptionList[0]}">
                ${DearDaria.galleryArrowsHTML(DearDaria.getLang())}
              </div>
              <p class="gallery-caption" id="gallery-caption-main">${galleryCaptionList[0]}</p>
            </div>
            <div class="copy">
              <h1>${DearDaria.collectionDisplayName(collection)}</h1>
              <p class="desc">${DearDaria.collectionDescription(collection)}</p>
              <div class="btn-row">
                <a href="${consultUrl}" class="btn primary">${DearDaria.t('request_consultation_for')}</a>
                <a href="#pieces" class="btn ghost">${DearDaria.t('view_available_pieces')}</a>
              </div>
              <p class="photos-example-note">${DearDaria.t('photos_examples_note')}</p>
            </div>
          </div>
        </div>
      </section>

      <section class="section tight border-top" id="pieces">
        <div class="container">
          <div class="section-head"><div><span class="eyebrow">${DearDaria.t('available_pieces')}</span><h2>${DearDaria.t('whats_included')}</h2></div></div>
          <div class="pieces-list">${piecesHTML}</div>
        </div>
      </section>

      <section class="section tight border-top">
        <div class="container">
          <div class="section-head"><div><span class="eyebrow">${DearDaria.t('gallery_label')}</span><h2>${DearDaria.t('full_collection')}</h2></div></div>
          <div class="gallery-strip" id="gallery-thumbs">${galleryImgs}</div>
        </div>
      </section>
    `;

    DearDaria.initLazyImages();

    DearDaria.initProductGallery({
      images: galleryImageList,
      captions: galleryCaptionList,
      mainImgEl: document.getElementById('gallery-main-img'),
      prevBtnEl: document.getElementById('gallery-prev'),
      nextBtnEl: document.getElementById('gallery-next'),
      thumbContainer: document.getElementById('gallery-thumbs'),
      altText: DearDaria.collectionDisplayName(collection),
      captionEl: document.getElementById('gallery-caption-main'),
    });
  }

  DearDaria.reRenderDynamic = render;
  render();
})();
</script>
</body>
</html>
