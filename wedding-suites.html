<body>

<nav class="site-nav" id="site-nav"></nav>

<header class="hero-controlled">
  <div class="hc-media">
    <img id="hero-image" src="" alt="Beau Papier wedding suite">
  </div>
  <div class="hc-copy">
    <h1 data-i18n="suites_heading">Collections composées</h1>
    <p class="lede" data-i18n="suites_sub">Une papeterie coordonnée, pensée comme un ensemble.</p>
  </div>
</header>

<section class="section tight border-top">
  <div class="container">
    <div class="section-head"><div><h2 data-i18n="suites_heading">Collections composées</h2></div></div>
    <div id="products-grid" class="grid cols-3"></div>
    <p class="photos-example-note" data-i18n="photos_examples_note">Les photographies présentent quelques exemples de réalisations. Les papiers, couleurs et finitions sont sélectionnés ensemble lors de votre rendez-vous, à partir d’échantillons physiques.</p>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/data.js"></script>
<script src="js/inspirations.js"></script>
<script>
(async function () {
  const data = await DearDaria.loadData();
  const withSuites = data.collections.filter(c => c.products.some(p => p.type === 'bundle'));

  function render() {
    const heroCollection = withSuites.find(c => c.id === 'calla_lily') || withSuites[0];
    const heroProduct = heroCollection.products.find(p => p.type === 'bundle');
    document.getElementById('hero-image').src = DearDaria.imgUrl(heroProduct.images[0]);

    const cards = withSuites
      .map(c => ({ collection: c, product: c.products.find(p => p.type === 'bundle') }))
      .sort((a, b) => (a.product.catalogue_order_suite || 999) - (b.product.catalogue_order_suite || 999))
      .map(({ collection, product }) => DearDaria.productCardHTML(collection, product, product.images[0]))
      .join('');
    DearDaria.renderGrid('products-grid', cards, 3);
  }
  DearDaria.reRenderDynamic = render;
  render();
})();
</script>
</body>
