<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique — Beau Papier</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<header class="section tight">
  <div class="container">
    <span class="eyebrow" data-i18n="shop_eyebrow"></span>
    <h1 style="font-size:clamp(36px,5vw,64px); font-style:italic; margin-top:14px;" data-i18n="shop_title"></h1>
    <p style="color:var(--ink-soft); max-width:52ch; margin-top:20px; font-size:16px; line-height:1.7;" data-i18n="shop_lede"></p>
  </div>
</header>

<section class="section tight border-top">
  <div class="container">
    <div class="filter-bar" id="filter-bar"></div>
    <div id="shop-grid" class="grid cols-4"></div>
    <div id="empty-state" class="empty-state" style="display:none;">
      <h3 data-i18n="nothing_here"></h3>
      <p data-i18n="nothing_here_desc"></p>
    </div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/data.js"></script>
<script>
(async function () {
  const data = await DearDaria.loadData();
  const collections = data.collections;

  const allProducts = [];
  collections.forEach(c => {
    c.products.forEach(p => {
      allProducts.push({ collection: c, product: p });
    });
  });

  const categories = ['all', ...Array.from(new Set(allProducts.map(x => x.product.type)))];
  let activeFilter = 'all';

  function renderFilters() {
    const bar = document.getElementById('filter-bar');
    bar.innerHTML = categories.map(cat => {
      const label = cat === 'all' ? DearDaria.t('all_filter') : DearDaria.productTypeLabel(cat);
      return `<button class="filter-pill ${cat === activeFilter ? 'active' : ''}" data-cat="${cat}">${label}</button>`;
    }).join('');
    bar.querySelectorAll('.filter-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFilter = btn.dataset.cat;
        renderFilters();
        renderProducts();
      });
    });
  }

  function renderProducts() {
    const filtered = activeFilter === 'all' ? allProducts : allProducts.filter(x => x.product.type === activeFilter);
    const grid = document.getElementById('shop-grid');
    const empty = document.getElementById('empty-state');
    if (filtered.length === 0) {
      grid.style.display = 'none';
      empty.style.display = 'block';
      return;
    }
    grid.style.display = 'grid';
    empty.style.display = 'none';
    DearDaria.renderGrid('shop-grid', filtered.map(x => DearDaria.productCardHTML(x.collection, x.product, x.product.images[0])).join(''), 4);
  }

  function render() {
    renderFilters();
    renderProducts();
  }
  DearDaria.reRenderDynamic = render;
  render();
})();
</script>
</body>
</html>
