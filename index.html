<script>
(async function () {
  const data = await DearDaria.loadData();
  const collections = data.collections;

  function pickDiverse(products, limit) {
    const ordered = collections.slice().sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
    const picks = [];
    for (const c of ordered) {
      if (picks.length >= limit) break;
      const product = c.products.find(p => p.type === 'sleeve') || c.products.find(p => p.type === 'bundle');
      if (product) picks.push({ collection: c, product });
    }
    return picks.slice(0, limit);
  }

  function render() {
    // hero gallery: 5 distinct images across different collections/silhouettes
    const heroSources = collections.filter(c => c.featured).slice(0, 5);
    const fallback = collections[0];
    const imgs = [
      heroSources[0] || fallback,
      heroSources[1] || fallback,
      heroSources[2] || fallback,
      heroSources[3] || fallback,
      heroSources[4] || fallback,
    ];
    const heroSlots = ['hg-main', 'hg-small-1', 'hg-small-2', 'hg-small-3', 'hg-small-4'];
    heroSlots.forEach((id, i) => {
      const c = imgs[i];
      const el = document.getElementById(id);
      el.href = `collection.html?slug=${c.slug}`;
      el.querySelector('img').src = DearDaria.imgUrl(c.hero);
      el.querySelector('img').alt = c.name;
    });

    // Jackets & sleeves: 6 curated, large cards
    const sleeveCollections = collections
      .filter(c => c.products.some(p => p.type === 'sleeve'))
      .sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
    const jacketCards = sleeveCollections.slice(0, 6).map(c => {
      const product = c.products.find(p => p.type === 'sleeve');
      return DearDaria.productCardHTML(c, product, product.images[0]);
    }).join('');
    DearDaria.renderGrid('jackets-grid', jacketCards, 3);

    // Wedding suites: 3-4 curated
    const suiteCollections = collections
      .filter(c => c.products.some(p => p.type === 'bundle'))
      .sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
    const suiteCards = suiteCollections.slice(0, 3).map(c => {
      const product = c.products.find(p => p.type === 'bundle');
      return DearDaria.productCardHTML(c, product, product.images[0]);
    }).join('');
    DearDaria.renderGrid('suites-grid', suiteCards, 3);

    // Custom design section image
    const customSource = collections.find(c => c.id === 'calla_bloom') || collections[0];
    document.getElementById('custom-dark-img').src = DearDaria.imgUrl(customSource.hero);

    // About strip placeholder image (uses an existing product photo until a real one is provided)
    const aboutSource = collections.find(c => c.id === 'hydrangea') || collections[0];
    document.getElementById('about-strip-img').src = DearDaria.imgUrl(aboutSource.hero);

    DearDaria.initLazyImages();
  }

  DearDaria.reRenderDynamic = render;
  render();
})();
</script>
