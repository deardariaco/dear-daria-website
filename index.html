<script>
(async function () {
  const data = await DearDaria.loadData();
  const collections = data.collections;

  function render() {
    const heroCollection = collections.find(c => c.id === 'hummingbird') || collections[0];
    const heroImages = [
      'hummingbird-bundle-2.jpg',
      'calla-lily-jacket-3.jpg',
      'constellation-bundle-1.jpg',
      'lavender-sleeve-7.jpg',
      'koi-bundle-1.jpg',
    ];
    DearDaria.initHeroCarousel(heroImages);

    // Faire-part homepage selection: explicit order from the approved catalogue,
    // not auto-picked. Falls back to nothing if a product lacks an order (so an
    // incomplete edit never silently shows the wrong item).
    const pochetteEntries = [];
    collections.forEach(c => {
      c.products.forEach(p => {
        if (p.homepage_order_pochette) pochetteEntries.push({ collection: c, product: p, order: p.homepage_order_pochette });
      });
    });
    pochetteEntries.sort((a, b) => a.order - b.order);
    const pochettesCards = pochetteEntries.map(({ collection, product }) =>
      DearDaria.productCardHTML(collection, product, product.images[0])
    ).join('');
    document.getElementById('pochettes-grid').innerHTML = pochettesCards;
    DearDaria.initCardCarousel('pochettes-grid', 'pochettes-prev', 'pochettes-next');

    // Suites homepage selection: same explicit-order approach.
    const suiteEntries = [];
    collections.forEach(c => {
      c.products.forEach(p => {
        if (p.homepage_order_suite) suiteEntries.push({ collection: c, product: p, order: p.homepage_order_suite });
      });
    });
    suiteEntries.sort((a, b) => a.order - b.order);
    const suiteCards = suiteEntries.map(({ collection, product }) =>
      DearDaria.productCardHTML(collection, product, product.images[0])
    ).join('');
    document.getElementById('suites-grid').innerHTML = suiteCards;
    DearDaria.initCardCarousel('suites-grid', 'suites-prev', 'suites-next');

    const customSource = collections.find(c => c.id === 'calla_bloom') || collections[0];
    document.getElementById('custom-dark-img').src = DearDaria.imgUrl(customSource.hero);

    DearDaria.initLazyImages();
  }

  DearDaria.reRenderDynamic = render;
  render();
})();
</script>
