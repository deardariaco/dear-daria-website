<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beau Papier — Papeterie Découpée pour Mariages, Suisse</title>
<meta name="description" content="Beau Papier — pochettes d'invitation découpées et suites de mariage coordonnées, personnalisées lors d'un accompagnement individuel avec Daria Wälchli, en Suisse.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<!-- 1. HERO (controlled height, single image) -->
<header class="hero-controlled">
  <div class="hc-media">
    <img id="hero-image" src="" alt="Beau Papier wedding invitation">
  </div>
  <div class="hc-copy">
    <span class="eyebrow" data-i18n="home_eyebrow"></span>
    <h1 data-i18n="hero_heading"></h1>
    <p class="lede" data-i18n="hero_sub"></p>
    <div class="btn-row">
      <a href="invitation-jackets.html" class="btn primary" data-i18n="hero_cta_pochettes"></a>
      <a href="wedding-suites.html" class="btn ghost" data-i18n="hero_cta_suites"></a>
    </div>
  </div>
</header>

<!-- 2. POCHETTES D'INVITATION -->
<section class="section border-top">
  <div class="container">
    <div class="section-head">
      <div>
        <h2 data-i18n="pochettes_heading"></h2>
        <p class="lede" data-i18n="pochettes_sub"></p>
      </div>
      <a href="invitation-jackets.html" class="btn ghost" data-i18n="see_all_pochettes"></a>
    </div>
    <div id="pochettes-grid" class="grid cols-3"></div>
  </div>
</section>

<!-- 3. SUITES DE MARIAGE -->
<section class="section border-top">
  <div class="container">
    <div class="section-head">
      <div><h2 data-i18n="suites_heading"></h2><p class="lede" data-i18n="suites_sub"></p></div>
      <a href="wedding-suites.html" class="btn ghost" data-i18n="see_all_suites"></a>
    </div>
    <div id="suites-grid" class="grid cols-3"></div>
  </div>
</section>

<!-- 4. PROCESS -->
<section class="section border-top">
  <div class="container">
    <div class="section-head"><div>
      <h2 data-i18n="process_heading"></h2>
    </div></div>
    <p style="color:var(--ink-soft); max-width:70ch; font-size:14.5px; line-height:1.8; margin-bottom:16px;" data-i18n="process_intro1"></p>
    <p style="color:var(--ink-soft); max-width:70ch; font-size:14.5px; line-height:1.8; margin-bottom:40px;" data-i18n="process_intro2"></p>
    <div class="process5-grid">
      <div class="step"><span class="num">01</span><h4 data-i18n="process1_title"></h4><p data-i18n="process1_text"></p></div>
      <div class="step"><span class="num">02</span><h4 data-i18n="process2_title"></h4><p data-i18n="process2_text"></p></div>
      <div class="step"><span class="num">03</span><h4 data-i18n="process3_title"></h4><p data-i18n="process3_text"></p></div>
      <div class="step"><span class="num">04</span><h4 data-i18n="process4_title"></h4><p data-i18n="process4_text"></p></div>
      <div class="step"><span class="num">05</span><h4 data-i18n="process5_title"></h4><p data-i18n="process5_text"></p></div>
    </div>
  </div>
</section>

<!-- 5. CRÉATION SUR MESURE -->
<section class="section custom-dark-section">
  <div class="container">
    <div class="custom-dark-grid">
      <div class="media">
        <img id="custom-dark-img" class="lazy-img" loading="lazy" src="" alt="Beau Papier bespoke design">
      </div>
      <div class="copy">
        <h2 data-i18n="sur_mesure_heading"></h2>
        <p data-i18n="sur_mesure_text"></p>
        <a href="bespoke.html" class="btn primary" data-i18n="talk_about_project"></a>
      </div>
    </div>
  </div>
</section>

<!-- 6. ABOUT (text-only, real content, no placeholder image) -->
<section class="section tight border-top">
  <div class="container" style="max-width:760px;">
    <span class="eyebrow" data-i18n="behind_heading"></span>
    <h2 style="font-size:clamp(26px,2.8vw,36px); margin-top:14px; margin-bottom:18px; font-style:italic;" data-i18n="about_title"></h2>
    <p style="color:var(--ink-soft); font-size:15px; line-height:1.8; margin-bottom:14px;" data-i18n="about_text1"></p>
    <p style="color:var(--ink-soft); font-size:15px; line-height:1.8;" data-i18n="about_text2"></p>
  </div>
</section>

<!-- 7. TESTIMONIALS — omitted: no real testimonials provided yet -->

<!-- 8. FAQ PREVIEW -->
<section class="section tight border-top">
  <div class="container" style="max-width:780px;">
    <div class="section-head"><div><h2 data-i18n="faq_preview_heading"></h2></div></div>
    <details class="faq-item" open><summary data-i18n="faqn1_q"></summary><p data-i18n="faqn1_a"></p></details>
    <details class="faq-item"><summary data-i18n="faqn2_q"></summary><p data-i18n="faqn2_a"></p></details>
    <details class="faq-item"><summary data-i18n="faqn3_q"></summary><p data-i18n="faqn3_a"></p></details>
    <div style="text-align:center; margin-top:28px;">
      <a href="faq.html" class="btn ghost" data-i18n="see_full_faq"></a>
    </div>
  </div>
</section>

<!-- 9. CONTACT + FOOTER -->
<div class="contact-banner">
  <h2 data-i18n="nav_request_consultation"></h2>
  <p data-i18n="signature_selection_note"></p>
  <a href="consultation.html" class="btn primary" data-i18n="nav_request_consultation"></a>
</div>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/shell.js"></script>
<script src="js/data.js"></script>
<script>
(async function () {
  const data = await DearDaria.loadData();
  const collections = data.collections;

  function render() {
    const heroCollection = collections.find(c => c.id === 'calla_bloom') || collections[0];
    document.getElementById('hero-image').src = DearDaria.imgUrl(heroCollection.hero);
    document.getElementById('hero-image').alt = heroCollection.name;

    const sleeveCollections = collections
      .filter(c => c.products.some(p => p.type === 'sleeve' || p.type === 'other'))
      .sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
    const pochettesCards = sleeveCollections.slice(0, 6).map(c => {
      const product = c.products.find(p => p.type === 'sleeve') || c.products.find(p => p.type === 'other');
      return DearDaria.productCardHTML(c, product, product.images[0]);
    }).join('');
    DearDaria.renderGrid('pochettes-grid', pochettesCards, 3);

    const suiteCollections = collections
      .filter(c => c.products.some(p => p.type === 'bundle'))
      .sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
    const suiteCards = suiteCollections.slice(0, 4).map(c => {
      const product = c.products.find(p => p.type === 'bundle');
      return DearDaria.productCardHTML(c, product, product.images[0]);
    }).join('');
    DearDaria.renderGrid('suites-grid', suiteCards, 3);

    const customSource = collections.find(c => c.id === 'calla_bloom') || collections[0];
    document.getElementById('custom-dark-img').src = DearDaria.imgUrl(customSource.hero);

    DearDaria.initLazyImages();
  }

  DearDaria.reRenderDynamic = render;
  render();
})();
</script>
</body>
</html>
